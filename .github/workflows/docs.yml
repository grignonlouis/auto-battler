name: Documentation

on:
  push:
    paths:
      - "auto-battler/docs/**"
      - "auto-battler/pom.xml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "auto-battler/docs/**"
      - "auto-battler/pom.xml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-battler
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: auto-battler/pom.xml

      - name: Generate HTML documentation
        run: |
          chmod +x mvnw
          ./mvnw -Pdocs asciidoctor:process-asciidoc

      - name: Upload HTML guide
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: auto-battler/target/docs
          if-no-files-found: error
