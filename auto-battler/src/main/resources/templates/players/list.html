<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('Players')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Players Ranking</h1>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <form class="row g-2 mb-4" method="get" th:action="@{/players}">
        <div class="col">
            <input type="text" class="form-control" name="search"
                   placeholder="Search by username or email" th:value="${search}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
        </div>
    </form>

    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Username</th>
            <th>Gold</th>
            <th>W / L</th>
            <th>Highest dungeon</th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="player : ${players}">
            <td th:text="${player.username}">Name</td>
            <td th:text="${player.gold}">0</td>
            <td>
                <span th:text="${player.totalVictories}">0</span>
                /
                <span th:text="${player.totalDefeats}">0</span>
            </td>
            <td th:text="${player.highestDungeonName != null ? player.highestDungeonName : '—'}">—</td>
            <td>
                <span class="badge text-bg-secondary" th:if="${player.admin}">Admin</span>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(players)}">
            <td colspan="7" class="text-center text-body-secondary">No players found.</td>
        </tr>

        </tbody>
    </table>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
