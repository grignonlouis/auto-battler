<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 700px;">

    <h1 class="mb-4" th:text="${pageTitle}">Title</h1>

    <form method="post" th:action="@{${formAction}}" th:object="${dungeonRequest}">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" rows="3" th:field="*{description}"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="difficulty" class="form-label">Difficulty (1 to 10)</label>
                <input type="number" min="1" max="10" class="form-control" th:field="*{difficulty}"
                       th:classappend="${#fields.hasErrors('difficulty')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('difficulty')}" th:errors="*{difficulty}"></div>
            </div>
        </div>

        <div class="form-check mb-4">
            <input type="checkbox" class="form-check-input" th:field="*{unlocked}">
            <label class="form-check-label" th:for="${#ids.prev('unlocked')}">Unlocked from the start</label>
        </div>

        <div class="mb-4">
            <label class="form-label">Monsters</label>
            <div class="form-text mb-2">A dungeon can contain at most one boss.</div>

            <div class="alert alert-danger py-2" th:if="${#fields.hasErrors('monsterIds')}" th:errors="*{monsterIds}"></div>

            <div class="form-check" th:each="monster : ${allMonsters}">
                <input type="checkbox" class="form-check-input" th:field="*{monsterIds}" th:value="${monster.id}">
                <label class="form-check-label" th:for="${#ids.prev('monsterIds')}">
                    <span th:text="${monster.name}">Name</span>
                    <span class="badge text-bg-danger ms-1" th:if="${monster.monsterType == 'BOSS'}">Boss</span>
                </label>
            </div>

            <p class="text-body-secondary" th:if="${#lists.isEmpty(allMonsters)}">
                No monsters yet. Create some in the Monsters section first.
            </p>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/dungeons}">Cancel</a>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
