<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('Monsters')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Monsters</h1>
        <a class="btn btn-primary" th:href="@{/monsters/new}">New monster</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <form class="row g-2 mb-4" method="get" th:action="@{/monsters}">
        <div class="col">
            <input type="text" class="form-control" name="search"
                   placeholder="Search by name" th:value="${search}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
        </div>
    </form>

    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Health</th>
            <th>Damage</th>
            <th>Defense</th>
            <th>Boss</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>

        <tr th:each="monster : ${monsters}">
            <td th:text="${monster.name}">Name</td>
            <td th:text="${monster.monsterType}">Type</td>
            <td th:text="${monster.health}">0</td>
            <td th:text="${monster.damage}">0</td>
            <td th:text="${monster.defense}">0</td>
            <td>
                <span class="badge text-bg-danger" th:if="${monster.boss}">Boss</span>
            </td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/monsters/{id}/edit(id=${monster.id})}">Edit</a>
                <form class="d-inline" method="post"
                      th:action="@{/monsters/{id}/delete(id=${monster.id})}"
                      onsubmit="return confirm('Delete this monster?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(monsters)}">
            <td colspan="8" class="text-center text-body-secondary">No monsters found.</td>
        </tr>

        </tbody>
    </table>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
