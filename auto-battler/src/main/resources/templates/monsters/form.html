<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 700px;">

    <h1 class="mb-4" th:text="${pageTitle}">Title</h1>

    <form method="post" th:action="@{${formAction}}" th:object="${monsterRequest}">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" rows="3" th:field="*{description}"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="mb-3">
            <label for="monsterType" class="form-label">Type</label>
            <select class="form-select" th:field="*{monsterType}"
                    th:classappend="${#fields.hasErrors('monsterType')} ? 'is-invalid'">
                <option value="">-- Choose a type --</option>
                <option th:each="type : ${monsterTypes}" th:value="${type}" th:text="${type}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('monsterType')}" th:errors="*{monsterType}"></div>
        </div>

        <div class="row">
            <div class="col-md-3 mb-3">
                <label for="health" class="form-label">Health</label>
                <input type="number" min="1" class="form-control" th:field="*{health}"
                       th:classappend="${#fields.hasErrors('health')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('health')}" th:errors="*{health}"></div>
            </div>

            <div class="col-md-3 mb-3">
                <label for="damage" class="form-label">Damage</label>
                <input type="number" min="0" class="form-control" th:field="*{damage}"
                       th:classappend="${#fields.hasErrors('damage')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('damage')}" th:errors="*{damage}"></div>
            </div>

            <div class="col-md-3 mb-3">
                <label for="defense" class="form-label">Defense</label>
                <input type="number" min="0" class="form-control" th:field="*{defense}"
                       th:classappend="${#fields.hasErrors('defense')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('defense')}" th:errors="*{defense}"></div>
            </div>
        </div>

        <div class="form-check mb-4">
            <input type="checkbox" class="form-check-input" th:field="*{boss}">
            <label class="form-check-label" th:for="${#ids.prev('boss')}">Boss</label>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/monsters}">Cancel</a>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
