<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Auto-Battler'">Auto-Battler</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Auto-Battler</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/heroes}">Heroes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/teams}">Teams</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/skills}">Skills</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/equipment}">Equipment</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/monsters}">Monsters</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/dungeons}">Dungeons</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/battle}">Battle</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/history}">History</a></li>
            </ul>
            <ul class="navbar-nav ms-lg-3">
                <li class="nav-item" th:if="${session.player == null}">
                    <a class="nav-link" th:href="@{/login}">Log in</a>
                </li>
                <li class="nav-item" th:if="${session.player == null}">
                    <a class="nav-link" th:href="@{/register}">Sign up</a>
                </li>
                <li class="nav-item" th:if="${session.player != null}">
                    <a class="nav-link" th:href="@{/logout}">Log out</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
