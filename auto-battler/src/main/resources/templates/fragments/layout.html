<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">

<!-- Fragment head : appel = th:replace="~{fragments/layout :: head('Titre')}" -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Auto-Battler'">Auto-Battler</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Fragment navbar : appel = th:replace="~{fragments/layout :: navbar}" -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Auto-Battler</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
                aria-label="Afficher le menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Héros</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Équipes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/skills}">Compétences</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Équipements</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Monstres</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Donjons</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Combat</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Historique</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Fragment scripts : à placer en fin de <body> -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
