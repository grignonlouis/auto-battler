<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('Donjon')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <h1>Liste des donjons</h1>
    <p class="lead text-body-secondary">
        Selectionnez un donjon à explorer.
    </p>
    <a th:href="@{/combat}" class="btn btn-primary">Placeholder Donjon</a>
    <ul>
        <li th:each="dungeon : ${dungeons}">
            <span th:text="${dungeon.id}">1</span> -
            <span th:text="${dungeon.name}">Nom de l'élément</span>
        </li>
    </ul>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
