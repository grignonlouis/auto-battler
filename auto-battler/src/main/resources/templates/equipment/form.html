<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 700px;">

    <h1 class="mb-4" th:text="${pageTitle}">Title</h1>

    <form method="post" th:action="@{${formAction}}" th:object="${equipmentRequest}">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="slot" class="form-label">Slot</label>
                <select class="form-select" th:field="*{slot}"
                        th:classappend="${#fields.hasErrors('slot')} ? 'is-invalid'">
                    <option value="">-- Choose a slot --</option>
                    <option th:each="s : ${slots}" th:value="${s}" th:text="${s}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('slot')}" th:errors="*{slot}"></div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="rarity" class="form-label">Rarity</label>
                <select class="form-select" th:field="*{rarity}"
                        th:classappend="${#fields.hasErrors('rarity')} ? 'is-invalid'">
                    <option value="">-- Choose a rarity --</option>
                    <option th:each="r : ${rarities}" th:value="${r}" th:text="${r}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('rarity')}" th:errors="*{rarity}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-3 mb-3">
                <label for="bonusAttack" class="form-label">Attack bonus</label>
                <input type="number" min="0" class="form-control" th:field="*{bonusAttack}"
                       th:classappend="${#fields.hasErrors('bonusAttack')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('bonusAttack')}" th:errors="*{bonusAttack}"></div>
            </div>

            <div class="col-md-3 mb-3">
                <label for="bonusHealth" class="form-label">Health bonus</label>
                <input type="number" min="0" class="form-control" th:field="*{bonusHealth}"
                       th:classappend="${#fields.hasErrors('bonusHealth')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('bonusHealth')}" th:errors="*{bonusHealth}"></div>
            </div>

            <div class="col-md-3 mb-3">
                <label for="bonusDefense" class="form-label">Defense bonus</label>
                <input type="number" min="0" class="form-control" th:field="*{bonusDefense}"
                       th:classappend="${#fields.hasErrors('bonusDefense')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('bonusDefense')}" th:errors="*{bonusDefense}"></div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/equipment}">Cancel</a>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
