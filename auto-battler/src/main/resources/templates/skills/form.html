<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 700px;">

    <h1 class="mb-4" th:text="${pageTitle}">Title</h1>

    <form method="post" th:action="@{${formAction}}" th:object="${skillRequest}">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" rows="3" th:field="*{description}"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="mb-3">
            <label for="skillType" class="form-label">Type</label>
            <select class="form-select" th:field="*{skillType}"
                    th:classappend="${#fields.hasErrors('skillType')} ? 'is-invalid'">
                <option value="">-- Choose a type --</option>
                <option th:each="type : ${skillTypes}" th:value="${type}" th:text="${type}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('skillType')}" th:errors="*{skillType}"></div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="power" class="form-label">Power</label>
                <input type="number" min="0" class="form-control" th:field="*{power}"
                       th:classappend="${#fields.hasErrors('power')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('power')}" th:errors="*{power}"></div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/skills}">Cancel</a>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
